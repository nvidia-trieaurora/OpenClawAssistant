#
# MCP Bridge — routes OpenClaw MCP requests through the host-side bridge
# server which has VPN/SSO access to NVIDIA internal services.

preset:
  name: mcp-bridge
  description: "MCP Bridge proxy on host (port 18790) for NVIDIA MaaS + external MCP servers"

network_policies:
  mcp_bridge_host:
    name: mcp_bridge_host
    endpoints:
      - host: host.docker.internal
        port: 18791
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
      - host: host.docker.internal
        port: 18790
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: "*", path: "/**" }
      - host: host.docker.internal
        port: 18792
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  mcp_direct_thirdparty:
    name: mcp_direct_thirdparty
    endpoints:
      - host: mcp.composio.dev
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
      - host: nvidia-be.glean.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
      - host: bmeemseeqpnsqgwdpcoj.supabase.co
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: "*", path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
